<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research – Übersicht</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1c1f24; --card:#fff; --muted:#5b6470; --accent:#2457d6; --line:#e1e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --fg:#e8eaed; --card:#1d2128; --muted:#9aa3af; --accent:#7aa2ff; --line:#2c323b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:820px; margin:0 auto; padding:2.5rem 1.2rem 4rem; }
  h1 { margin:0 0 .3rem; font-size:1.9rem; }
  .sub { color:var(--muted); margin:0 0 1.5rem; }
  input { width:100%; padding:.7rem .9rem; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); margin-bottom:1.2rem; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:.8rem; }
  a.card { display:block; padding:1rem 1.2rem; background:var(--card); border:1px solid var(--line); border-radius:12px; text-decoration:none; color:inherit; transition:border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); transform:translateY(-2px); outline:none; }
  .date { font-size:.85rem; color:var(--muted); }
  .title { font-weight:600; color:var(--accent); }
  .empty { display:none; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Deep Research</h1>
  <p class="sub">Meine Forschungsberichte. Jeder Bericht ist eine eigene Seite. · <a href="motivation/index.html" style="color:var(--accent)">Meine Motivation →</a></p>
  <input id="q" type="search" placeholder="Berichte durchsuchen …" aria-label="Berichte durchsuchen">
  <ul id="list">
    <li data-s="chris koerner business ideen geschäftsideen side hustle koerner office podcast youtube nebenverdienst ki agentur lokale dienstleistungen">
      <a class="card" href="researches/26.11.17_chris_koerner_business_ideas/bericht.html">
        <div class="date">17.11.2026</div>
        <div class="title">Alle Business-Ideen von Chris Koerner</div>
      </a>
    </li>
    <li data-s="james altucher wie wird man reich synthese">
      <a class="card" href="researches/26.11.12_james_altucher_reichtum/bericht.html">
        <div class="date">12.11.2026</div>
        <div class="title">James Altucher: Wie wird man reich?</div>
      </a>
    </li>
    <li data-s="paul graham wie wird man reich forschungsbericht">
      <a class="card" href="researches/26.11.12_paul_graham_reichtum/bericht.html">
        <div class="date">12.11.2026</div>
        <div class="title">Wie wird man laut Paul Graham reich?</div>
      </a>
    </li>
  </ul>
  <p class="empty" id="empty">Keine Treffer.</p>
</main>
<script>
  var q = document.getElementById('q'), items = document.querySelectorAll('#list li'), empty = document.getElementById('empty');
  q.addEventListener('input', function () {
    var t = q.value.toLowerCase().trim(), n = 0;
    items.forEach(function (li) {
      var show = li.dataset.s.indexOf(t) !== -1 || li.textContent.toLowerCase().indexOf(t) !== -1;
      li.style.display = show ? '' : 'none';
      if (show) n++;
    });
    empty.style.display = n ? 'none' : 'block';
  });
</script>
</body>
</html>
