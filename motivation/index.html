<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Meine Motivation</title>
<style>
  :root {
    --bg: #f7f2ec;
    --bg-soft: #f1e8de;
    --card: #fffdfa;
    --card-2: #fdf7f0;
    --fg: #2b2520;
    --muted: #6f665c;
    --line: #e8ddd0;
    --accent: #c2410c;
    --accent-2: #b45309;
    --accent-soft: #ffedd5;
    --on-accent: #fff7ed;
    --header-grad: linear-gradient(135deg, #fff1dd 0%, #ffe0bd 45%, #ffd0ab 100%);
    --note-bg: #fff3bf;
    --note-line: #f0dd94;
    --note-fg: #4a3f1f;
    --shadow: 0 2px 10px rgba(70, 45, 20, 0.07), 0 12px 30px -18px rgba(70, 45, 20, 0.28);
    --shadow-hover: 0 6px 18px rgba(70, 45, 20, 0.10), 0 18px 40px -20px rgba(70, 45, 20, 0.35);
    --radius: 16px;
    --ring: 3px solid var(--accent);
    --overlay-bg: rgba(28, 22, 17, 0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14110e;
      --bg-soft: #1a1612;
      --card: #1f1a15;
      --card-2: #251f19;
      --fg: #f2eae0;
      --muted: #b3a698;
      --line: #352c24;
      --accent: #fb923c;
      --accent-2: #fbbf24;
      --accent-soft: #3a2617;
      --on-accent: #1c1207;
      --header-grad: linear-gradient(135deg, #2b1d12 0%, #3a2415 50%, #442a17 100%);
      --note-bg: #3a3218;
      --note-line: #4d4320;
      --note-fg: #f2e6bd;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35), 0 14px 34px -20px rgba(0, 0, 0, 0.8);
      --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.45), 0 20px 44px -22px rgba(0, 0, 0, 0.9);
      --overlay-bg: rgba(0, 0, 0, 0.72);
    }
  }
  html[data-theme="light"] {
    --bg: #f7f2ec;
    --bg-soft: #f1e8de;
    --card: #fffdfa;
    --card-2: #fdf7f0;
    --fg: #2b2520;
    --muted: #6f665c;
    --line: #e8ddd0;
    --accent: #c2410c;
    --accent-2: #b45309;
    --accent-soft: #ffedd5;
    --on-accent: #fff7ed;
    --header-grad: linear-gradient(135deg, #fff1dd 0%, #ffe0bd 45%, #ffd0ab 100%);
    --note-bg: #fff3bf;
    --note-line: #f0dd94;
    --note-fg: #4a3f1f;
    --shadow: 0 2px 10px rgba(70, 45, 20, 0.07), 0 12px 30px -18px rgba(70, 45, 20, 0.28);
    --shadow-hover: 0 6px 18px rgba(70, 45, 20, 0.10), 0 18px 40px -20px rgba(70, 45, 20, 0.35);
    --overlay-bg: rgba(28, 22, 17, 0.55);
  }
  html[data-theme="dark"] {
    --bg: #14110e;
    --bg-soft: #1a1612;
    --card: #1f1a15;
    --card-2: #251f19;
    --fg: #f2eae0;
    --muted: #b3a698;
    --line: #352c24;
    --accent: #fb923c;
    --accent-2: #fbbf24;
    --accent-soft: #3a2617;
    --on-accent: #1c1207;
    --header-grad: linear-gradient(135deg, #2b1d12 0%, #3a2415 50%, #442a17 100%);
    --note-bg: #3a3218;
    --note-line: #4d4320;
    --note-fg: #f2e6bd;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35), 0 14px 34px -20px rgba(0, 0, 0, 0.8);
    --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.45), 0 20px 44px -22px rgba(0, 0, 0, 0.9);
    --overlay-bg: rgba(0, 0, 0, 0.72);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-wrap: anywhere;
  }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: var(--ring); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }

  .site-header {
    background: var(--header-grad);
    border-bottom: 1px solid var(--line);
    padding: 1rem 1.25rem 1.6rem;
  }
  .header-inner { max-width: 1240px; margin: 0 auto; }
  .back {
    display: inline-block;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.9rem;
    opacity: 0.75;
    padding: 0.25rem 0.4rem;
    border-radius: 8px;
  }
  .back:hover { opacity: 1; background: rgba(128, 96, 60, 0.12); }
  .head-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 0.4rem;
  }
  h1 {
    margin: 0.2rem 0 0.15rem;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .sub { margin: 0; color: var(--muted); max-width: 46ch; }
  .head-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    border-radius: 999px;
    padding: 0.5rem 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: transparent; border-color: #dc2626; color: #dc2626; }
  .btn.danger:hover { background: #dc2626; color: #fff; }

  main { max-width: 1240px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }

  .impulse {
    position: relative;
    background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: calc(var(--radius) + 6px);
    padding: 1.25rem 1.25rem 1.4rem;
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }
  .impulse::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, var(--accent-soft), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .impulse-top {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.9rem;
  }
  .impulse-top h2 {
    margin: 0;
    font-size: 0.82rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .impulse-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .impulse-body { cursor: pointer; }
  .impulse-body .visual { margin: 0; }

  .toolbar {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1.6rem;
    box-shadow: var(--shadow);
  }
  .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .row + .row { margin-top: 0.8rem; }
  .toolbar input[type="search"], .toolbar select {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 0.55rem 0.75rem;
    min-height: 42px;
  }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 180px; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    cursor: pointer;
    user-select: none;
    font-size: 0.95rem;
    padding: 0.3rem 0.2rem;
  }
  .switch input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .toolbar .btn.primary { margin-left: auto; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 0.4rem; flex: 1 1 300px; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--fg);
    border-radius: 999px;
    padding: 0.2rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .tag-chip:hover { border-color: var(--accent); }
  .tag-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .tag-n { opacity: 0.65; font-size: 0.72rem; }
  .count { margin-left: auto; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }

  .gallery { column-count: 1; column-gap: 1rem; }
  @media (min-width: 640px) { .gallery { column-count: 2; } }
  @media (min-width: 960px) { .gallery { column-count: 3; } }
  @media (min-width: 1240px) { .gallery { column-count: 4; } }

  .card {
    display: block;
    width: 100%;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin: 0 0 1rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    animation: card-in 0.3s ease both;
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--accent); }
  .card-body { padding: 1rem 1rem 0.75rem; display: flex; flex-direction: column; gap: 0.65rem; }

  .visual { display: flex; flex-direction: column; gap: 0.45rem; }
  .quote-text {
    margin: 0;
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 1.25rem;
    line-height: 1.45;
    text-indent: -0.42em;
    padding-left: 0.42em;
  }
  .quote-text.big, .visual.big .quote-text { font-size: clamp(1.5rem, 3.4vw, 2.3rem); }
  .quote-author { align-self: flex-end; color: var(--muted); font-size: 0.92rem; }
  .card-zitat .card-body { background: linear-gradient(180deg, transparent, var(--accent-soft) 260%); }

  .post-head { display: flex; gap: 0.6rem; align-items: center; }
  .avatar {
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700; flex: none;
  }
  .post-author { font-weight: 600; line-height: 1.2; }
  .post-text { white-space: pre-wrap; }
  .visual.big .post-text { font-size: 1.15rem; }

  .card-img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: cover; border-radius: 10px; background: var(--bg-soft); }
  .visual.big .card-img { max-height: 70vh; object-fit: contain; }
  figcaption, .caption { color: var(--muted); font-size: 0.9rem; }
  .visual.bild { margin: 0; }

  .visual.notiz {
    background: var(--note-bg);
    color: var(--note-fg);
    border: 1px solid var(--note-line);
    border-radius: 12px;
    padding: 1rem;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .note-text { white-space: pre-wrap; font-size: 1.02rem; }
  .note-label { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; }

  .link-domain {
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .link-title { font-weight: 600; text-decoration: none; color: var(--fg); font-size: 1.05rem; }
  .link-title:hover { text-decoration: underline; color: var(--accent); }
  .source-link { font-size: 0.8rem; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .card-actions {
    display: flex; flex-wrap: wrap; gap: 0.25rem;
    border-top: 1px solid var(--line);
    padding-top: 0.55rem;
  }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    cursor: pointer; border-radius: 8px; padding: 0.28rem 0.5rem;
    font-size: 0.8rem; line-height: 1.2;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--bg-soft); color: var(--fg); }
  .icon-btn.fav { font-size: 1.05rem; padding: 0.14rem 0.45rem; }
  .icon-btn.fav.active { color: var(--accent-2); }
  .icon-btn.danger:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }

  .empty-hint {
    color: var(--muted);
    text-align: center;
    padding: 2.2rem 1rem;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--card-2);
  }

  dialog {
    width: min(600px, calc(100vw - 2rem));
    max-height: calc(100vh - 2rem);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--fg);
    padding: 1.25rem;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
  }
  dialog::backdrop { background: var(--overlay-bg); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 0.9rem; font-size: 1.25rem; }
  .type-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
  .type-tab { position: relative; }
  .type-tab input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .type-tab span {
    display: inline-block;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.8rem;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .type-tab input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .type-tab input:focus-visible + span { outline: var(--ring); outline-offset: 2px; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.85rem; }
  .lbl { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
  .field input[type="text"], .field input[type="url"], .field textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    padding: 0.6rem 0.75rem;
    resize: vertical;
  }
  .field textarea { min-height: 110px; }
  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 0.9rem;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
    font-size: 0.9rem;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone img { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; margin: 0 auto 0.6rem; }
  #removeImg { margin-top: 0.4rem; }
  .check { display: flex; gap: 0.5rem; align-items: center; margin: 0.4rem 0 0.9rem; cursor: pointer; }
  .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .form-error { color: #dc2626; margin: 0 0 0.8rem; font-size: 0.9rem; }
  .dialog-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .dialog-actions .spacer { flex: 1; }

  .overlay {
    position: fixed; inset: 0;
    background: var(--overlay-bg);
    backdrop-filter: blur(6px);
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    padding: 1.2rem;
  }
  .lightbox { background: rgba(10, 8, 6, 0.92); z-index: 70; }
  .lb-inner { max-width: 94vw; max-height: 90vh; display: flex; flex-direction: column; gap: 0.7rem; align-items: center; }
  .lb-inner img { max-width: 94vw; max-height: 78vh; object-fit: contain; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .lb-caption { color: #f5ede4; margin: 0; text-align: center; max-width: 70ch; }
  .overlay-close {
    position: absolute; top: 1rem; right: 1rem;
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.35); color: #fff;
    font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  .overlay-close:hover { background: rgba(0,0,0,0.65); }

  .stage {
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 96%, transparent);
    z-index: 65;
    padding: 0;
    align-items: stretch;
  }
  .stage-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 1rem;
    z-index: 2;
  }
  .stage-counter { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.04em; }
  .stage-btns { display: flex; gap: 0.5rem; }
  .overlay-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    border-radius: 999px;
    min-width: 2.6rem; min-height: 2.6rem;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
    font-size: 1rem;
  }
  .overlay-btn:hover { border-color: var(--accent); }
  .overlay-btn.nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 2rem; line-height: 1; padding: 0.2rem 0.9rem 0.45rem;
    z-index: 2;
  }
  #stagePrev { left: 0.8rem; }
  #stageNext { right: 0.8rem; }
  .stage-mid {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 4.2rem 4.6rem;
    overflow: auto;
  }
  .stage-body { width: min(760px, 100%); }
  .stage-body .visual { gap: 0.9rem; }
  .stage-progress {
    position: absolute; left: 0; bottom: 0; height: 5px; width: 100%;
    background: var(--accent);
    transform-origin: left center;
    animation: grow 10s linear forwards;
  }
  .stage-progress.paused { animation-play-state: paused; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .toast {
    position: fixed; left: 50%; bottom: 1.4rem;
    transform: translate(-50%, 1.2rem);
    background: var(--fg); color: var(--bg);
    padding: 0.65rem 1.1rem;
    border-radius: 999px;
    font-size: 0.9rem;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 80;
    max-width: min(90vw, 520px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: #b91c1c; color: #fff; }

  @media (max-width: 640px) {
    .head-row { align-items: flex-start; }
    .stage-mid { padding: 4rem 0.6rem 3.5rem; }
    .overlay-btn.nav { top: auto; bottom: 1rem; transform: none; }
    #stagePrev { left: 0.6rem; }
    #stageNext { right: 0.6rem; }
    .impulse-actions { width: 100%; }
    .toolbar .btn.primary { margin-left: 0; width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .card:hover, .btn:hover { transform: none; }
    .stage-progress { animation: none; transform: scaleX(1); }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="back" href="../index.html">← Übersicht</a>
    <div class="head-row">
      <div>
        <h1>Meine Motivation</h1>
        <p class="sub">Zitate, Posts, Bilder und Notizen, die mich voranbringen.</p>
      </div>
      <div class="head-actions">
        <button id="themeBtn" class="btn ghost" type="button" aria-label="Farbschema umschalten">Dunkel</button>
        <button id="exportBtn" class="btn ghost" type="button">Export</button>
        <button id="importBtn" class="btn ghost" type="button">Import</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="impulse" aria-labelledby="impulseTitle">
    <div class="impulse-top">
      <h2 id="impulseTitle">Impuls des Tages</h2>
      <div class="impulse-actions">
        <button id="slideshowBtn" class="btn" type="button">Diashow starten</button>
        <button id="impulseBtn" class="btn ghost" type="button">Neuer Impuls</button>
      </div>
    </div>
    <div id="impulseBody" class="impulse-body"></div>
    <p id="impulseHint" class="empty-hint" hidden>Deine Sammlung ist noch leer. Klicke auf „+ Neu“ und sammle deinen ersten Impuls.</p>
  </section>

  <section class="toolbar" aria-label="Filter und Suche">
    <div class="row">
      <input id="search" type="search" placeholder="Suchen in Text, Autor, Tags …" aria-label="Einträge durchsuchen">
      <select id="typFilter" aria-label="Nach Typ filtern">
        <option value="alle">Alle Typen</option>

        <option value="bild">Bilder</option>

      <select id="sortFilter" aria-label="Sortierung">
        <option value="neu">Neueste zuerst</option>
        <option value="alt">Älteste zuerst</option>

      <label class="switch"><input id="favToggle" type="checkbox"> <span>Nur Favoriten</span></label>

  <section id="gallery" class="gallery" aria-label="Deine Sammlung"></section>

</main>

  <form id="entryForm" novalidate>
    <h2 id="dialogTitle">Neuer Eintrag</h2>
    <div class="type-tabs" role="radiogroup" aria-label="Typ wählen">
      <label class="type-tab"><input type="radio" name="typ" value="zitat" checked><span>Zitat</span></label>
      <label class="type-tab"><input type="radio" name="typ" value="post"><span>Post</span></label>
      <label class="type-tab"><input type="radio" name="typ" value="bild"><span>Bild</span></label>
      <label class="type-tab"><input type="radio" name="typ" value="notiz"><span>Notiz</span></label>
      <label class="type-tab"><input type="radio" name="typ" value="link"><span>Link</span></label>
    </div>
    <div class="field" data-types="zitat post notiz bild link">
      <label class="lbl" id="textLabel" for="fText">Zitat</label>
      <textarea id="fText" rows="4"></textarea>
    </div>
    <div class="field" data-types="zitat post notiz bild link">
      <label class="lbl" for="fAutor">Autor (optional)</label>

      <label class="lbl" id="quelleLabel" for="fQuelle">Quelle (Link, optional)</label>

      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Bild auswählen, einfügen oder hierher ziehen">

        <div id="previewWrap" hidden>

      <label class="lbl" for="fTags">Tags (durch Kommas getrennt)</label>

    <label class="check"><input id="fFav" type="checkbox"> Als Favorit markieren</label>

    <div class="dialog-actions">
      <button id="deleteBtn" class="btn danger" type="button" hidden>Löschen</button>
      <span class="spacer"></span>
      <button id="cancelBtn" class="btn ghost" type="button">Abbrechen</button>
      <button id="saveBtn" class="btn primary" type="button">Speichern</button>
    </div>
  </form>
</dialog>

<div id="lightbox" class="overlay lightbox" hidden role="dialog" aria-modal="true" aria-label="Bildansicht">

    <span id="stageCounter" class="stage-counter"></span>

      <button id="stagePlay" class="overlay-btn" type="button" aria-label="Diashow pausieren" hidden>Pause</button>

  </div>
  <div id="stageProgress" class="stage-progress" hidden></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var TYPES = ["zitat", "post", "bild", "notiz", "link"];
  var TEXT_LABELS = { zitat: "Zitat", post: "Post-Text", notiz: "Notiz", bild: "Bildunterschrift", link: "Beschreibung (optional)" };
  var QUELLE_LABELS = { zitat: "Quelle (Link, optional)", post: "Quelle (Link, optional)", notiz: "Quelle (Link, optional)", link: "Link (URL)" };
  var INIT_KEY = "motivation-init";
  var THEME_KEY = "motivation-theme";
  var DB_NAME = "motivation";
  var STORE = "eintraege";

  var state = {
    entries: [],
    view: [],
    q: "",
    typ: "alle",
    favOnly: false,
    tag: null,
    sort: "neu",
    impulseId: null
  };

  var editingId = null;
  var bildData = null;
  var db = null;
  var toastTimer = null;

  var stageState = { list: [], index: 0, slide: false, paused: false, timer: null, remaining: 10000, startedAt: 0 };

  function $(id) { return document.getElementById(id); }

  var gallery = $("gallery");
  var emptyState = $("emptyState");
  var tagCloud = $("tagCloud");
  var countEl = $("count");
  var searchEl = $("search");
  var typFilter = $("typFilter");
  var sortFilter = $("sortFilter");
  var favToggle = $("favToggle");
  var impulseBody = $("impulseBody");
  var impulseHint = $("impulseHint");
  var impulseBtn = $("impulseBtn");
  var slideshowBtn = $("slideshowBtn");
  var entryDialog = $("entryDialog");
  var entryForm = $("entryForm");
  var dialogTitle = $("dialogTitle");
  var textLabel = $("textLabel");
  var quelleLabel = $("quelleLabel");
  var fText = $("fText");
  var fAutor = $("fAutor");
  var fQuelle = $("fQuelle");
  var fTags = $("fTags");
  var fFav = $("fFav");
  var dialogError = $("dialogError");
  var deleteBtn = $("deleteBtn");
  var saveBtn = $("saveBtn");
  var cancelBtn = $("cancelBtn");
  var dropzone = $("dropzone");
  var dzHint = $("dzHint");
  var previewWrap = $("previewWrap");
  var previewImg = $("previewImg");
  var removeImg = $("removeImg");
  var fileInput = $("fileInput");
  var lightbox = $("lightbox");
  var lbImg = $("lbImg");
  var lbCaption = $("lbCaption");
  var stageEl = $("stage");
  var stageBody = $("stageBody");
  var stageCounter = $("stageCounter");
  var stagePlay = $("stagePlay");
  var stageProgress = $("stageProgress");
  var toastEl = $("toast");
  var themeBtn = $("themeBtn");

  function el(tag, props) {
    var node = document.createElement(tag);
    var kids = Array.prototype.slice.call(arguments, 2);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "checked") node.checked = !!v;
        else if (k === "value") node.value = v;
        else if (k === "disabled") node.disabled = !!v;
        else if (k === "dataset") Object.assign(node.dataset, v);
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v);
      });
    }
    kids.forEach(function (kid) {
      if (kid === null || kid === undefined || kid === false) return;
      if (kid && kid.nodeType) node.appendChild(kid);
      else node.appendChild(document.createTextNode(String(kid)));
    });
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function newId() {
    try {
      if (typeof crypto !== "undefined" && crypto && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
    } catch (err) {}
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function safeUrl(raw) {
    if (!raw) return null;
    try {
      var u = new URL(String(raw), window.location.href);
      if (u.protocol === "http:" || u.protocol === "https:") return u.href;
    } catch (err) {}
    return null;
  }

  function domainOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (err) { return url; }
  }

  function safeImage(src) {
    if (!src) return null;
    if (/^data:image\//i.test(src)) return src;
    if (/^blob:/i.test(src)) return src;
    return null;
  }

  function parseTags(raw) {
    return String(raw || "")
      .split(",")
      .map(function (t) { return t.trim().toLowerCase().replace(/^#+/, "").trim(); })
      .filter(function (t) { return t.length > 0; })
      .filter(function (t, i, arr) { return arr.indexOf(t) === i; });
  }

  function normalizeEntry(raw) {
    return {
      id: String(raw.id),
      typ: TYPES.indexOf(raw.typ) !== -1 ? raw.typ : "notiz",
      text: typeof raw.text === "string" ? raw.text : "",
      autor: typeof raw.autor === "string" ? raw.autor : "",
      quelle: typeof raw.quelle === "string" ? raw.quelle : "",
      bild: typeof raw.bild === "string" ? raw.bild : "",
      tags: Array.isArray(raw.tags) ? parseTags(raw.tags.join(",")) : [],
      favorit: raw.favorit === true,
      erstellt: typeof raw.erstellt === "number" ? raw.erstellt : Date.now()
    };
  }

  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, isError ? 4500 : 2600);
  }

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = window.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function (ev) {
        var database = ev.target.result;
        if (!database.objectStoreNames.contains(STORE)) {
          database.createObjectStore(STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function dbAll() {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, "readonly");
      var rq = tx.objectStore(STORE).getAll();
      rq.onsuccess = function () { resolve(rq.result || []); };
      rq.onerror = function () { reject(rq.error); };
    });
  }

  function dbPut(entry) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(entry);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.onabort = function () { reject(tx.error); };
    });
  }

  function dbDel(id) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }

  function dbPutMany(list) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, "readwrite");
      var store = tx.objectStore(STORE);
      list.forEach(function (e) { store.put(e); });
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.onabort = function () { reject(tx.error); };
    });
  }

  var SEED = [
    { text: "Es ist nicht wenig Zeit, die wir haben, sondern es ist viel Zeit, die wir nicht nutzen.", autor: "Seneca", tags: ["disziplin", "zeit"], favorit: true },
    { text: "Nicht weil es schwer ist, wagen wir es nicht, sondern weil wir es nicht wagen, ist es schwer.", autor: "Seneca", tags: ["mut", "stoizismus"], favorit: false },
    { text: "Auf die Dauer nimmt die Seele die Farbe der Gedanken an.", autor: "Marc Aurel", tags: ["stoizismus", "gelassenheit"], favorit: true },
    { text: "Nicht die Dinge selbst beunruhigen die Menschen, sondern ihre Meinungen und Urteile über die Dinge.", autor: "Epiktet", tags: ["stoizismus", "achtsamkeit"], favorit: false },
    { text: "Es ist nicht genug zu wissen, man muss auch anwenden; es ist nicht genug zu wollen, man muss auch tun.", autor: "Johann Wolfgang von Goethe", tags: ["disziplin", "handeln"], favorit: true },
    { text: "Auch der weiteste Weg beginnt mit einem ersten Schritt.", autor: "Laozi", tags: ["anfang", "geduld"], favorit: false },
    { text: "Was mich nicht umbringt, macht mich stärker.", autor: "Friedrich Nietzsche", tags: ["mut", "staerke"], favorit: true },
    { text: "Wer ein Warum zu leben hat, erträgt fast jedes Wie.", autor: "Friedrich Nietzsche", tags: ["sinn", "staerke"], favorit: false }
  ];

  function seedExamples() {
    var base = Date.now();
    return SEED.map(function (s, i) {
      return {
        id: newId(),
        typ: "zitat",
        text: s.text,
        autor: s.autor,
        quelle: "",
        bild: "",
        tags: s.tags,
        favorit: s.favorit,
        erstellt: base - (SEED.length - i) * 60000
      };
    });
  }

  function getFiltered() {
    var list = state.entries.slice();
    if (state.typ !== "alle") list = list.filter(function (e) { return e.typ === state.typ; });
    if (state.favOnly) list = list.filter(function (e) { return e.favorit; });
    if (state.tag) list = list.filter(function (e) { return e.tags.indexOf(state.tag) !== -1; });
    var q = state.q.trim().toLowerCase();
    if (q) {
      list = list.filter(function (e) {
        return (e.text + " " + e.autor + " " + e.tags.join(" ")).toLowerCase().indexOf(q) !== -1;
      });
    }
    if (state.sort === "neu") list.sort(function (a, b) { return b.erstellt - a.erstellt; });
    else if (state.sort === "alt") list.sort(function (a, b) { return a.erstellt - b.erstellt; });
    else {
      for (var i = list.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      }
    }
    return list;
  }

  function buildVisual(e, big) {
    var wrap = el("div", { class: "visual " + e.typ + (big ? " big" : "") });

    if (e.typ === "zitat") {
      wrap.appendChild(el("blockquote", { class: "quote-text" }, "„", e.text, "“"));
      if (e.autor) wrap.appendChild(el("div", { class: "quote-author" }, "— " + e.autor));
      var qsrc = safeUrl(e.quelle);
      if (qsrc) wrap.appendChild(el("a", { class: "source-link", href: qsrc, target: "_blank", rel: "noopener noreferrer" }, domainOf(qsrc)));
      return wrap;
    }

    if (e.typ === "post") {
      var initial = (e.autor || "?").trim().charAt(0).toUpperCase() || "?";
      var head = el("div", { class: "post-head" },
        el("div", { class: "avatar", "aria-hidden": "true" }, initial),
        el("div", null,
          el("div", { class: "post-author" }, e.autor || "Unbekannt"),
          el("div", { class: "muted small" }, "Post")
        )
      );
      wrap.appendChild(head);
      wrap.appendChild(el("div", { class: "post-text" }, e.text));
      var psrc = safeUrl(e.quelle);
      if (psrc) wrap.appendChild(el("a", { class: "source-link", href: psrc, target: "_blank", rel: "noopener noreferrer" }, "Quelle: " + domainOf(psrc)));
      return wrap;
    }

    if (e.typ === "bild") {
      var imgSrc = safeImage(e.bild);
      if (imgSrc) {
        wrap.appendChild(el("img", { class: "card-img", src: imgSrc, alt: e.text || "Bild", loading: "lazy" }));
      }
      if (e.text) wrap.appendChild(el("div", { class: "caption" }, e.text));
      if (e.autor) wrap.appendChild(el("div", { class: "muted small" }, e.autor));
      return wrap;
    }

    if (e.typ === "notiz") {
      wrap.appendChild(el("div", { class: "note-label" }, "Notiz"));
      wrap.appendChild(el("div", { class: "note-text" }, e.text));
      if (e.autor) wrap.appendChild(el("div", { class: "muted small" }, e.autor));
      return wrap;
    }

    var lsrc = safeUrl(e.quelle);
    wrap.appendChild(el("div", { class: "link-domain" }, lsrc ? domainOf(lsrc) : "Kein Link"));
    if (lsrc) {
      wrap.appendChild(el("a", { class: "link-title", href: lsrc, target: "_blank", rel: "noopener noreferrer" }, e.text || lsrc));
    } else if (e.text) {
      wrap.appendChild(el("div", { class: "link-title" }, e.text));
    }
    if (e.autor) wrap.appendChild(el("div", { class: "muted small" }, e.autor));
    return wrap;
  }

  function buildCard(e) {
    var card = el("article", { class: "card card-" + e.typ });
    var body = el("div", { class: "card-body" });
    body.appendChild(buildVisual(e, false));

    if (e.tags.length) {
      var tagRow = el("div", { class: "tag-row" });
      e.tags.forEach(function (t) {
        tagRow.appendChild(el("button", {
          class: "tag-chip" + (state.tag === t ? " active" : ""),
          type: "button",
          title: "Nach Tag filtern: " + t,
          "aria-label": "Tag " + t + (state.tag === t ? ", Filter aktiv" : ""),
          onclick: function (ev) { ev.stopPropagation(); setTag(state.tag === t ? null : t); }
        }, "#" + t));
      });
      body.appendChild(tagRow);
    }

    var actions = el("div", { class: "card-actions" });
    actions.appendChild(el("button", {
      class: "icon-btn fav" + (e.favorit ? " active" : ""),
      type: "button",
      "aria-label": e.favorit ? "Favorit entfernen" : "Als Favorit markieren",
      "aria-pressed": e.favorit ? "true" : "false",
      title: e.favorit ? "Favorit entfernen" : "Als Favorit markieren",
      onclick: function (ev) { ev.stopPropagation(); toggleFav(e); }
    }, e.favorit ? "★" : "☆"));
    actions.appendChild(el("button", {
      class: "icon-btn",
      type: "button",
      onclick: function (ev) { ev.stopPropagation(); openDialog(e); }
    }, "Bearbeiten"));
    actions.appendChild(el("button", {
      class: "icon-btn",
      type: "button",
      onclick: function (ev) { ev.stopPropagation(); copyEntry(e); }
    }, "Kopieren"));
    actions.appendChild(el("button", {
      class: "icon-btn danger",
      type: "button",
      onclick: function (ev) { ev.stopPropagation(); removeEntry(e); }
    }, "Löschen"));

    body.appendChild(actions);
    card.appendChild(body);

    card.addEventListener("click", function (ev) {
      if (ev.target.closest("button, a")) return;
      openForEntry(e);
    });

    return card;
  }

  function renderGallery(list) {
    clear(gallery);
    list.forEach(function (e) { gallery.appendChild(buildCard(e)); });
    if (!list.length) {
      emptyState.hidden = false;
      emptyState.textContent = state.entries.length
        ? "Keine Einträge passen zu deiner Auswahl. Passe Suche oder Filter an."
        : "Noch keine Einträge. Klicke auf „+ Neu“, um deinen ersten Impuls zu speichern.";
    } else {
      emptyState.hidden = true;
    }
  }

  function renderTagCloud() {
    clear(tagCloud);
    var counts = {};
    state.entries.forEach(function (e) {
      e.tags.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    var tags = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b, "de");
    });
    if (state.tag) {
      tagCloud.appendChild(el("button", {
        class: "tag-chip active",
        type: "button",
        title: "Tag-Filter entfernen",
        "aria-label": "Tag-Filter " + state.tag + " entfernen",
        onclick: function () { setTag(null); }
      }, "#" + state.tag + " ×"));
    }
    tags.forEach(function (t) {
      if (t === state.tag) return;
      tagCloud.appendChild(el("button", {
        class: "tag-chip",
        type: "button",
        title: "Nach Tag filtern",
        "aria-label": "Tag " + t + ", " + counts[t] + (counts[t] === 1 ? " Eintrag" : " Einträge"),
        onclick: function () { setTag(t); }
      }, "#" + t, el("span", { class: "tag-n" }, String(counts[t]))));
    });
    if (!tags.length && !state.tag) {
      tagCloud.appendChild(el("span", { class: "muted small" }, "Noch keine Tags."));
    }
  }

  function renderCount(list) {
    if (list.length === state.entries.length) {
      countEl.textContent = list.length + (list.length === 1 ? " Eintrag" : " Einträge");
    } else {
      countEl.textContent = list.length + " von " + state.entries.length + " Einträgen";
    }
  }

  function hashString(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) {
      h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  function dayKey() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function impulsePool() {
    var preferred = state.entries.filter(function (e) { return e.typ === "zitat" || e.typ === "post" || e.typ === "bild"; });
    return preferred.length ? preferred : state.entries.slice();
  }

  function renderImpulse() {
    var pool = impulsePool();
    clear(impulseBody);
    if (!pool.length) {
      impulseBody.hidden = true;
      impulseHint.hidden = false;
      impulseBtn.hidden = true;
      slideshowBtn.hidden = true;
      return;
    }
    impulseBody.hidden = false;
    impulseHint.hidden = true;
    impulseBtn.hidden = false;
    slideshowBtn.hidden = false;

    if (!state.impulseId || !pool.some(function (e) { return e.id === state.impulseId; })) {
      pool.sort(function (a, b) { return a.id.localeCompare(b.id); });
      var pick = pool[hashString(dayKey()) % pool.length];
      state.impulseId = pick.id;
    }
    var entry = state.entries.find(function (e) { return e.id === state.impulseId; });
    if (!entry) entry = pool[0];

    impulseBody.appendChild(buildVisual(entry, true));
    impulseBody.setAttribute("aria-label", "Impuls des Tages. Klicken für Fokusansicht.");
  }

  function render() {
    var list = getFiltered();
    state.view = list;
    renderGallery(list);
    renderTagCloud();
    renderCount(list);
    renderImpulse();
  }

  function setTag(t) {
    state.tag = t;
    render();
  }

  function toggleFav(e) {
    e.favorit = !e.favorit;
    dbPut(e).then(function () {
      return dbAll();
    }).then(function (all) {
      state.entries = all;
      render();
      toast(e.favorit ? "Als Favorit markiert." : "Favorit entfernt.");
    }).catch(function () { toast("Speichern fehlgeschlagen.", true); });
  }

  function copyEntry(e) {
    var parts = [];
    if (e.text) parts.push(e.text);
    if (e.autor) parts.push("— " + e.autor);
    var u = safeUrl(e.quelle);
    if (u) parts.push(u);
    var text = parts.join("\n");
    if (!text) { toast("Nichts zum Kopieren vorhanden.", true); return; }
    var done = function () { toast("In die Zwischenablage kopiert."); };
    var fail = function () { toast("Kopieren nicht möglich.", true); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done, fail); });
    } else {
      fallbackCopy(text, done, fail);
    }
  }

  function fallbackCopy(text, done, fail) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    if (ok) done(); else fail();
  }

  function removeEntry(e) {
    if (!window.confirm("Diesen Eintrag wirklich löschen?")) return;
    dbDel(e.id).then(function () {
      return dbAll();
    }).then(function (all) {
      state.entries = all;
      if (state.impulseId === e.id) state.impulseId = null;
      render();
      toast("Eintrag gelöscht.");
    }).catch(function () { toast("Löschen fehlgeschlagen.", true); });
  }

  function openForEntry(e) {
    if (e.typ === "bild") { openLightbox(e); return; }
    var list = state.view.slice();
    var idx = list.findIndex(function (x) { return x.id === e.id; });
    if (idx === -1) { list = [e]; idx = 0; }
    openStage(list, idx, false);
  }

  function openLightbox(e) {
    lbImg.src = safeImage(e.bild) || "";
    lbImg.alt = e.text || "Bild";
    lbCaption.textContent = e.text || "";
    lightbox.hidden = false;
    $("lbClose").focus();
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lbImg.removeAttribute("src");
  }

  function openStage(list, index, slide) {
    if (!list.length) return;
    stageState.list = list.slice();
    stageState.index = Math.max(0, Math.min(index, list.length - 1));
    stageState.slide = !!slide;
    stageState.paused = false;
    stageState.remaining = 10000;
    stageEl.hidden = false;
    stagePlay.hidden = !slide;
    stageProgress.hidden = !slide;
    renderStage();
    $("stageClose").focus();
  }

  function renderStage() {
    var e = stageState.list[stageState.index];
    if (!e) { closeStage(); return; }
    clear(stageBody);
    stageBody.appendChild(buildVisual(e, true));
    stageCounter.textContent = (stageState.index + 1) + " / " + stageState.list.length;
    stagePlay.textContent = stageState.paused ? "Weiter" : "Pause";
    stagePlay.setAttribute("aria-label", stageState.paused ? "Diashow fortsetzen" : "Diashow pausieren");
    if (stageState.slide) restartProgress();
  }

  function restartProgress() {
    clearTimeout(stageState.timer);
    stageState.remaining = 10000;
    stageProgress.classList.remove("paused");
    stageProgress.style.animation = "none";
    void stageProgress.offsetWidth;
    stageProgress.style.animation = "";
    if (stageState.paused) stageProgress.classList.add("paused");
    else scheduleSlide();
  }

  function scheduleSlide() {
    clearTimeout(stageState.timer);
    stageState.startedAt = Date.now();
    stageState.timer = setTimeout(function () { advanceStage(1); }, stageState.remaining);
  }

  function advanceStage(n) {
    if (!stageState.list.length) return;
    stageState.index = (stageState.index + n + stageState.list.length) % stageState.list.length;
    renderStage();
  }

  function togglePause() {
    if (!stageState.slide) return;
    stageState.paused = !stageState.paused;
    if (stageState.paused) {
      stageState.remaining -= (Date.now() - stageState.startedAt);
      if (stageState.remaining < 0) stageState.remaining = 0;
      clearTimeout(stageState.timer);
      stageProgress.classList.add("paused");
    } else {
      stageProgress.classList.remove("paused");
      scheduleSlide();
    }
    stagePlay.textContent = stageState.paused ? "Weiter" : "Pause";
    stagePlay.setAttribute("aria-label", stageState.paused ? "Diashow fortsetzen" : "Diashow pausieren");
  }

  function closeStage() {
    clearTimeout(stageState.timer);
    stageState.timer = null;
    stageEl.hidden = true;
    clear(stageBody);
  }

  function currentType() {
    var r = entryForm.querySelector('input[name="typ"]:checked');
    return r ? r.value : "zitat";
  }

  function updateTypeUI() {
    var t = currentType();
    entryForm.querySelectorAll("[data-types]").forEach(function (g) {
      g.hidden = g.dataset.types.split(" ").indexOf(t) === -1;
    });
    textLabel.textContent = TEXT_LABELS[t];
    quelleLabel.textContent = QUELLE_LABELS[t];
    fText.required = (t === "zitat" || t === "post" || t === "notiz");
    if (t === "post") fText.placeholder = "Text des Posts …";
    else if (t === "notiz") fText.placeholder = "Deine Notiz …";
    else if (t === "bild") fText.placeholder = "Kurze Bildunterschrift …";
    else if (t === "link") fText.placeholder = "Worum geht es in dem Link? (optional)";
    else fText.placeholder = "Zitat eingeben …";
  }

  function showFormError(msg) {
    dialogError.textContent = msg;
    dialogError.hidden = false;
  }

  function setPreview() {
    if (bildData) {
      previewImg.src = bildData;
      previewWrap.hidden = false;
      dzHint.textContent = "Bild ausgewählt. Klicken oder ziehen, um es zu ersetzen.";
    } else {
      previewImg.removeAttribute("src");
      previewWrap.hidden = true;
      dzHint.textContent = "Bild hierher ziehen, mit Strg+V einfügen oder klicken zum Auswählen";
    }
  }

  function openDialog(entry) {
    editingId = entry ? entry.id : null;
    bildData = entry && entry.typ === "bild" ? (entry.bild || null) : null;
    entryForm.reset();
    dialogError.hidden = true;
    dialogTitle.textContent = entry ? "Eintrag bearbeiten" : "Neuer Eintrag";
    deleteBtn.hidden = !entry;

    var typ = entry ? entry.typ : "zitat";
    var radio = entryForm.querySelector('input[name="typ"][value="' + typ + '"]');
    if (radio) radio.checked = true;

    fText.value = entry ? entry.text : "";
    fAutor.value = entry ? entry.autor : "";
    fQuelle.value = entry ? entry.quelle : "";
    fTags.value = entry ? entry.tags.join(", ") : "";
    fFav.checked = entry ? !!entry.favorit : false;
    setPreview();
    updateTypeUI();

    entryDialog.showModal();
    setTimeout(function () { fText.focus(); }, 30);
  }

  function saveEntry() {
    dialogError.hidden = true;
    var typ = currentType();
    var text = fText.value.trim();
    var autor = fAutor.value.trim();
    var quelleRaw = fQuelle.value.trim();

    if ((typ === "zitat" || typ === "post" || typ === "notiz") && !text) {
      showFormError("Bitte einen Text eingeben.");
      return;
    }
    if (typ === "bild" && !bildData) {
      showFormError("Bitte ein Bild auswählen, einfügen oder hierher ziehen.");
      return;
    }
    var quelle = "";
    if (quelleRaw) {
      var u = safeUrl(quelleRaw);
      if (!u) { showFormError("Bitte eine gültige http(s)-Adresse für die Quelle angeben."); return; }
      quelle = u;
    }
    if (typ === "link" && !quelle) {
      showFormError("Bitte einen gültigen Link angeben.");
      return;
    }

    var existing = editingId ? state.entries.find(function (e) { return e.id === editingId; }) : null;
    var entry = {
      id: existing ? existing.id : newId(),
      typ: typ,
      text: text,
      autor: autor,
      quelle: quelle,
      bild: typ === "bild" ? (bildData || "") : "",
      tags: parseTags(fTags.value),
      favorit: fFav.checked,
      erstellt: existing ? existing.erstellt : Date.now()
    };

    saveBtn.disabled = true;
    dbPut(entry).then(function () {
      return dbAll();
    }).then(function (all) {
      state.entries = all;
      saveBtn.disabled = false;
      entryDialog.close();
      render();
      toast(existing ? "Eintrag aktualisiert." : "Eintrag gespeichert.");
    }).catch(function () {
      saveBtn.disabled = false;
      showFormError("Speichern fehlgeschlagen. Bitte erneut versuchen.");
    });
  }

  function deleteFromDialog() {
    if (!editingId) return;
    if (!window.confirm("Diesen Eintrag wirklich löschen?")) return;
    var id = editingId;
    dbDel(id).then(function () {
      return dbAll();
    }).then(function (all) {
      state.entries = all;
      if (state.impulseId === id) state.impulseId = null;
      entryDialog.close();
      render();
      toast("Eintrag gelöscht.");
    }).catch(function () { toast("Löschen fehlgeschlagen.", true); });
  }

  function readAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result)); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("Bild konnte nicht gelesen werden.")); };
      img.src = src;
    });
  }

  function processImage(file) {
    if (!file || (file.type && !/^image\//.test(file.type))) {
      return Promise.reject(new Error("Bitte eine Bilddatei wählen."));
    }
    return readAsDataURL(file).then(loadImage).then(function (img) {
      var max = 1600;
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error("Bild hat keine gültige Größe.");
      if (w > max || h > max) {
        var scale = Math.min(max / w, max / h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      var canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL("image/jpeg", 0.85);
    });
  }

  function handleImageFile(file) {
    if (!file) return;
    dzHint.textContent = "Bild wird verarbeitet …";
    processImage(file).then(function (data) {
      bildData = data;
      setPreview();
    }).catch(function (err) {
      bildData = null;
      setPreview();
      showFormError(err && err.message ? err.message : "Bild konnte nicht verarbeitet werden.");
    });
  }

  function updateThemeBtn() {
    var current = document.documentElement.dataset.theme;
    if (current !== "light" && current !== "dark") {
      current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    themeBtn.textContent = current === "dark" ? "Hell" : "Dunkel";
    themeBtn.setAttribute("aria-label", current === "dark" ? "Zum hellen Design wechseln" : "Zum dunklen Design wechseln");
  }

  function toggleTheme() {
    var current = document.documentElement.dataset.theme;
    if (current !== "light" && current !== "dark") {
      current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (err) {}
    updateThemeBtn();
  }

  function stamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function exportData() {
    var data = { format: "motivation-v1", exportiert: new Date().toISOString(), eintraege: state.entries };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "motivation-backup-" + stamp() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast("Export gestartet (" + state.entries.length + " Einträge).");
  }

  function importData(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        toast("Import fehlgeschlagen: Datei ist kein gültiges JSON.", true);
        return;
      }
      if (!parsed || parsed.format !== "motivation-v1" || !Array.isArray(parsed.eintraege)) {
        toast("Import fehlgeschlagen: unbekanntes Format.", true);
        return;
      }
      var valid = [];
      for (var i = 0; i < parsed.eintraege.length; i++) {
        var raw = parsed.eintraege[i];
        if (!raw || typeof raw !== "object" || typeof raw.id !== "string" || TYPES.indexOf(raw.typ) === -1) {
          toast("Import fehlgeschlagen: ungültiger Eintrag in der Datei.", true);
          return;
        }
        valid.push(normalizeEntry(raw));
      }
      dbPutMany(valid).then(function () {
        return dbAll();
      }).then(function (all) {
        state.entries = all;
        render();
        toast(valid.length + " Einträge importiert.");
      }).catch(function () {
        toast("Import fehlgeschlagen: Speichern nicht möglich.", true);
      });
    };
    reader.onerror = function () { toast("Datei konnte nicht gelesen werden.", true); };
    reader.readAsText(file);
  }

  function attachEvents() {
    $("newBtn").addEventListener("click", function () { openDialog(null); });
    $("exportBtn").addEventListener("click", exportData);
    $("importBtn").addEventListener("click", function () { $("importFile").click(); });
    $("importFile").addEventListener("change", function (ev) {
      var file = ev.target.files && ev.target.files[0];
      importData(file);
      ev.target.value = "";
    });
    themeBtn.addEventListener("click", toggleTheme);

    searchEl.addEventListener("input", function () { state.q = searchEl.value; render(); });
    typFilter.addEventListener("change", function () { state.typ = typFilter.value; render(); });
    sortFilter.addEventListener("change", function () { state.sort = sortFilter.value; render(); });
    favToggle.addEventListener("change", function () { state.favOnly = favToggle.checked; render(); });

    impulseBtn.addEventListener("click", function () {
      var pool = impulsePool();
      if (!pool.length) return;
      var others = pool.filter(function (e) { return e.id !== state.impulseId; });
      var pickFrom = others.length ? others : pool;
      var pick = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      state.impulseId = pick.id;
      renderImpulse();
    });

    slideshowBtn.addEventListener("click", function () {
      var list = state.view.length ? state.view : getFiltered();
      if (!list.length) { toast("Keine Einträge für die Diashow.", true); return; }
      openStage(list, 0, true);
    });

    impulseBody.addEventListener("click", function (ev) {
      if (ev.target.closest("a, button")) return;
      var entry = state.entries.find(function (e) { return e.id === state.impulseId; });
      if (!entry) return;
      openForEntry(entry);
    });

    entryForm.addEventListener("submit", function (ev) { ev.preventDefault(); saveEntry(); });
    saveBtn.addEventListener("click", saveEntry);
    cancelBtn.addEventListener("click", function () { entryDialog.close(); });
    deleteBtn.addEventListener("click", deleteFromDialog);
    entryForm.querySelectorAll('input[name="typ"]').forEach(function (r) {
      r.addEventListener("change", updateTypeUI);
    });

    entryDialog.addEventListener("paste", function (ev) {
      if (currentType() !== "bild") return;
      var items = ev.clipboardData && ev.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf("image/") === 0) {
          var f = items[i].getAsFile();
          if (f) { ev.preventDefault(); handleImageFile(f); }
          break;
        }
      }
    });

    dropzone.addEventListener("click", function (ev) {
      if (ev.target.closest("button")) return;
      fileInput.click();
    });
    dropzone.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        fileInput.click();
      }
    });
    ["dragenter", "dragover"].forEach(function (name) {
      dropzone.addEventListener(name, function (ev) { ev.preventDefault(); dropzone.classList.add("over"); });
    });
    ["dragleave", "dragend"].forEach(function (name) {
      dropzone.addEventListener(name, function () { dropzone.classList.remove("over"); });
    });
    dropzone.addEventListener("drop", function (ev) {
      ev.preventDefault();
      dropzone.classList.remove("over");
      var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (f) handleImageFile(f);
    });
    fileInput.addEventListener("change", function (ev) {
      var f = ev.target.files && ev.target.files[0];
      if (f) handleImageFile(f);
      ev.target.value = "";
    });
    removeImg.addEventListener("click", function (ev) {
      ev.stopPropagation();
      bildData = null;
      setPreview();
    });

    entryDialog.addEventListener("close", function () {
      editingId = null;
      bildData = null;
      dialogError.hidden = true;
    });

    $("lbClose").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", function (ev) {
      if (ev.target === lightbox) closeLightbox();
    });

    $("stageClose").addEventListener("click", closeStage);
    $("stagePrev").addEventListener("click", function () { advanceStage(-1); });
    $("stageNext").addEventListener("click", function () { advanceStage(1); });
    stagePlay.addEventListener("click", togglePause);

    document.addEventListener("keydown", function (ev) {
      if (!stageEl.hidden) {
        if (ev.key === "Escape") { ev.preventDefault(); closeStage(); return; }
        if (ev.key === "ArrowLeft") { ev.preventDefault(); advanceStage(-1); return; }
        if (ev.key === "ArrowRight") { ev.preventDefault(); advanceStage(1); return; }
        if (ev.key === " " || ev.code === "Space") {
          if (stageState.slide) { ev.preventDefault(); togglePause(); }
          return;
        }
        return;
      }
      if (!lightbox.hidden) {
        if (ev.key === "Escape") { ev.preventDefault(); closeLightbox(); }
        return;
      }
      if (entryDialog.open) return;
      var t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      if (ev.key === "n" || ev.key === "N") { ev.preventDefault(); openDialog(null); }
      else if (ev.key === "/") { ev.preventDefault(); searchEl.focus(); searchEl.select(); }
    });

    var media = window.matchMedia("(prefers-color-scheme: dark)");
    var onSchemeChange = function () {
      if (!document.documentElement.dataset.theme) updateThemeBtn();
    };
    if (media.addEventListener) media.addEventListener("change", onSchemeChange);
    else if (media.addListener) media.addListener(onSchemeChange);
  }

  function init() {
    var savedTheme = null;
    try { savedTheme = localStorage.getItem(THEME_KEY); } catch (err) {}
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.dataset.theme = savedTheme;
    }
    updateThemeBtn();
    attachEvents();

    openDB().then(function (database) {
      db = database;
      return dbAll();
    }).then(function (all) {
      state.entries = all;
      var seeded = false;
      try { seeded = localStorage.getItem(INIT_KEY) === "1"; } catch (err) {}
      if (!seeded) {
        if (!state.entries.length) {
          return dbPutMany(seedExamples()).then(function () {
            try { localStorage.setItem(INIT_KEY, "1"); } catch (err) {}
            return dbAll();
          });
        }
        try { localStorage.setItem(INIT_KEY, "1"); } catch (err) {}
      }
      return state.entries;
    }).then(function (all) {
      if (all) state.entries = all;
      render();
    }).catch(function () {
      toast("Speicher nicht verfügbar. Einträge können nicht geladen werden.", true);
      render();
    });
  }

  init();
})();
</script>
</body>
</html>
